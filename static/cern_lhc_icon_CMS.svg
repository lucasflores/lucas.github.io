<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- CMS detector — compact muon solenoid, more segmented look -->
  <circle cx="50" cy="50" r="48" fill="#1a0e2e" stroke="#8b00ff" stroke-width="2"/>
  <!-- Outer muon system — segmented arc segments -->
  <path d="M50,8 A42,42 0 0,1 92,50" fill="none" stroke="#8b00ff" stroke-width="3"/>
  <path d="M92,50 A42,42 0 0,1 50,92" fill="none" stroke="#8b00ff" stroke-width="3"/>
  <path d="M50,92 A42,42 0 0,1 8,50"  fill="none" stroke="#8b00ff" stroke-width="3"/>
  <path d="M8,50 A42,42 0 0,1 50,8"   fill="none" stroke="#8b00ff" stroke-width="3"/>
  <!-- ECAL ring (electromagnetic calorimeter) -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <!-- Solenoid coil -->
  <circle cx="50" cy="50" r="16" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Collision point -->
  <circle cx="50" cy="50" r="6" fill="#FFD700" stroke="#FFA500" stroke-width="1.5"/>
  <!-- Particle jets -->
  <line x1="50" y1="50" x2="20" y2="10" stroke="#e879f9" stroke-width="1.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="80" y2="90" stroke="#e879f9" stroke-width="1.5" opacity="0.9"/>
  <line x1="50" y1="50" x2="88" y2="38" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="50" x2="12" y2="62" stroke="#c084fc" stroke-width="1.2" opacity="0.7"/>
  <line x1="50" y1="50" x2="60" y2="8"  stroke="#e879f9" stroke-width="1.5" opacity="0.9"/>
  <!-- Label -->
  <text x="50" y="96" text-anchor="middle" font-family="monospace" font-size="9" fill="#c084fc" letter-spacing="2">CMS</text>
</svg>
